name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: DidiProfitOverlay

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verificar secretos de firma
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Falta ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Falta ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Falta ANDROID_KEY_ALIAS" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Falta ANDROID_KEY_PASSWORD" && exit 1)

      - name: Preparar firma permanente
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release-key.jks
          test -s app/release-key.jks || (echo "El keystore quedó vacío" && exit 1)

      - name: Verificar integridad del keystore
        run: |
          ACTUAL_SHA="$(sha256sum app/release-key.jks | awk '{print $1}')"
          EXPECTED_SHA="ed2afa62b8d34e8d66b806abd9d3ec878e515cde35cc9993add0093383f4203f"
          echo "SHA-256 obtenido: $ACTUAL_SHA"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 no coincide con el keystore original."
            echo "Vuelve a copiar completo el valor ANDROID_KEYSTORE_BASE64."
            exit 1
          fi
          echo "Keystore correcto: el BASE64 coincide exactamente."

      - name: Verificar contraseña y alias
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list             -keystore app/release-key.jks             -storepass "$ANDROID_KEYSTORE_PASSWORD"             -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "Contraseña y alias del keystore correctos."

      - name: Verificar contraseña de la clave privada
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p /tmp/didi-sign-test
          echo "prueba" > /tmp/didi-sign-test/test.txt
          jar cf /tmp/didi-sign-test/test.jar -C /tmp/didi-sign-test test.txt
          jarsigner             -keystore app/release-key.jks             -storepass "$ANDROID_KEYSTORE_PASSWORD"             -keypass "$ANDROID_KEY_PASSWORD"             /tmp/didi-sign-test/test.jar             "$ANDROID_KEY_ALIAS" >/dev/null
          echo "Contraseña de la clave privada correcta."

      - name: Compilar APK firmado
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: DiDi-Rentabilidad-V3-APK
          path: DidiProfitOverlay/app/build/outputs/apk/release/app-release.apk
